services:
  app:
    # Test logs are disposable and must not persist customer-like fixture text.
    logging:
      driver: none
    # No auto-restart in test mode
    restart: "no"
    environment:
      # Isolated test DB — never touches prod bot-data volume
      SQLITE_PATH: /data/bot-test.sqlite
      # STARTUP_DIAGNOSTICS_ENABLED is intentionally NOT set here so the value from
      # .env.dev wins (dev pages Telegram on startup). CI runs `npm test` (vitest),
      # not this docker stack, so CI is unaffected.
    volumes:
      - bot-data-test:/data

  cloudflared:
    # Disable tunnel in test mode (use npm run start:tunnel locally if needed)
    profiles:
      - disabled

volumes:
  bot-data-test:
